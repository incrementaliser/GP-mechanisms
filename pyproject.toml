[project]
name = "gp-mechanisms-notebook"
version = "0.1.0"
description = "Marimo notebook for garden path sentence processing mechanisms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.11.0",
    "torch>=2.3.0",
    "transformers>=4.42.0",
    "nnsight>=0.2.19",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0",
    "altair>=5.4.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=16.0.0",
    "circuitsvis>=1.43.3",
    "captum>=0.9.0",
]

[tool.marimo]
formatting = { line_length = 100 }
